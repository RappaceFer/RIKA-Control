name: Android APK - planning v0.6
on:
  workflow_dispatch:
  push:
    branches: [main, fix/real-controls-v05]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --platforms android --project-name rika_control .
          rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format and analyze
        run: |
          dart format lib test
          flutter analyze lib test
      - name: JavaScript bridge mock tests
        run: node --test tools/bridge_test.mjs
      - name: Unit and widget tests - no real stove requests
        run: flutter test
      - name: Build APK
        run: flutter build apk --debug --build-name=0.6.0 --build-number=${{ github.run_number }}
      - name: Name APK and record build
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/RIKA-Control-v0.6.0-debug.apk
          printf 'Version: 0.6.0\nCommit: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > dist/BUILD.txt
          sha256sum dist/*.apk >> dist/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RIKA-Control-v0.6.0-${{ github.run_number }}-debug
          path: dist/
          if-no-files-found: error
