[platformio]
default_envs = lilygo_t_display_s3

[env:lilygo_t_display_s3]
platform = espressif32@6.12.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
lib_deps =
  moononournation/GFX Library for Arduino@^1.5.0
